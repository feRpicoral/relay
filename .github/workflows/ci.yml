name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same PR/branch when new commits land.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      ANTHROPIC_API_KEY: ci-anthropic-key
      DEEPGRAM_API_KEY: ci-deepgram-key
      CARTESIA_API_KEY: ci-cartesia-key
      ELEVENLABS_API_KEY: ci-elevenlabs-key
      LIVEKIT_API_KEY: ci-livekit-key
      LIVEKIT_API_SECRET: ci-livekit-secret
      LIVEKIT_URL: wss://ci.livekit.cloud
      INNGEST_EVENT_KEY: ci-inngest-event
      INNGEST_SIGNING_KEY: ci-inngest-signing
      RESEND_API_KEY: ci-resend-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # 32+ chars required by lib/crypto.ts; only used to satisfy module-load
      # validation during typecheck/build.
      ENCRYPTION_KEY: ci-encryption-key-padded-to-32-chars!
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate Prisma client
        run: yarn db:generate

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    # Only run on PRs: pushes to main have already been validated locally via
    # the husky commit-msg hook.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - name: Validate PR commits
        run: |
          yarn commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}"

  worker-docker:
    name: worker docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
