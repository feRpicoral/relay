# Fly.io config for the Relay agent worker.
# The worker is a long-lived Node process that connects outbound to LiveKit
# Cloud via websocket and never accepts inbound HTTP, so there is intentionally
# no [[services]] section.

app = "relay-worker"
primary_region = "dfw"

[build]
dockerfile = "Dockerfile"

[deploy]
# `rolling` so an active worker isn't killed mid-call: Fly boots a new machine
# first, then drains the old one. `immediate` is faster but drops in-flight
# calls, which is the wrong tradeoff for a voice product.
strategy = "rolling"

# LiveKit Cloud distributes inbound rooms across whichever workers are
# connected, so we don't need a Fly HA pair. Deploy with `fly deploy --ha=false`
# or set the count to 1 after the first deploy with `fly scale count 1`.

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 1024

# Per-machine process check: `pgrep` succeeds while tsx is up. The worker has
# no HTTP listener, so this is the cheapest reliable liveness signal short of
# wiring a heartbeat endpoint.
[[checks]]
name = "worker-process"
type = "exec"
command = "pgrep -f tsx"
interval = "30s"
timeout = "5s"
grace_period = "30s"
